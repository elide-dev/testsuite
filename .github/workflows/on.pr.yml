name: "PR"

"on":
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: "pr-${{ github.event.number }}"
  cancel-in-progress: true

jobs:
  compliance:
    name: "Compliance"
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/check.compliance.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      runner: '["self-hosted","linux"]'
      elide_ref: "nightly"
      suite_test262: true
      suite_wpt_wintertc: true
      suite_cpython_core: true
      suite_javac_jtreg: true
      options: '{"log":true,"failure_output":"hide","update_summaries":false,"ratchet":false,"apply_updates":false}'

  harness:
    name: "Harness Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          disable-sudo: true
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: step-security/setup-bun@f6f5dadeac34f70c7828f731569e8d6e8330b8fb
        with:
          bun-version: "1.4.0"
      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd harness
      - name: Typecheck launchers and harness
        run: |
          bun run typecheck
          bun run typecheck:harness
      - name: Test harness
        run: bun run test:harness
      - name: Test launchers
        run: bun test bin/ --timeout 60000
