# WinterTC / WPT expectations baseline.
# Keys are picomatch globs over WPT-relative test paths (no subtest suffix). Skipped tests stay in the
# pass-rate denominator; excluded ones (out of scope for a WinterTC runtime) leave it. Ratcheted
# per-subtest failures are counted but expected. Skip only what is structurally unreachable --
# never a file with passing subtests.

# Out of scope: browser-only files (document, iframes, navigation, media elements, page
# lifecycle). WinterTC runtimes have no DOM, so these count in no pass rate. Mixed files run, and
# only their DOM subtests are excluded (`[exclude-ids]`). A new `.window.js` on re-vendor runs
# until triaged here.
[exclude]
"fetch/fetch-later/**" = "browser-only: needs a DOM (document, iframe, navigation or media elements)"
"encoding/streams/invalid-realm.window.js" = "browser-only: needs a DOM (document, iframe, navigation or media elements)"
"encoding/streams/realms.window.js" = "browser-only: needs a DOM (document, iframe, navigation or media elements)"
"encoding/unsupported-labels.window.js" = "browser-only: needs a DOM (document, iframe, navigation or media elements)"
"fetch/api/basic/mediasource.window.js" = "browser-only: needs a DOM (document, iframe, navigation or media elements)"
"fetch/api/request/multi-globals/construct-in-detached-frame.window.js" = "browser-only: needs a DOM (document, iframe, navigation or media elements)"
"fetch/content-type/response.window.js" = "browser-only: needs a DOM (document, iframe, navigation or media elements)"
"fetch/content-type/script.window.js" = "browser-only: needs a DOM (document, iframe, navigation or media elements)"
"fetch/data-urls/navigate.window.js" = "browser-only: needs a DOM (document, iframe, navigation or media elements)"
"fetch/h1-parsing/resources-with-0x00-in-header.window.js" = "browser-only: needs a DOM (document, iframe, navigation or media elements)"
"fetch/local-network-access/navigate.tentative.window.js" = "browser-only: needs a DOM (document, iframe, navigation or media elements)"
"fetch/nosniff/parsing-nosniff.window.js" = "browser-only: needs a DOM (document, iframe, navigation or media elements)"
"fetch/origin/assorted.window.js" = "browser-only: needs a DOM (document, iframe, navigation or media elements)"
"fetch/range/general.window.js" = "browser-only: needs a DOM (document, iframe, navigation or media elements)"
"url/javascript-urls.window.js" = "browser-only: needs a DOM (document, iframe, navigation or media elements)"
"url/percent-encoding.window.js" = "browser-only: needs a DOM (document, iframe, navigation or media elements)"
"url/url-setters-a-area.window.js" = "browser-only: needs a DOM (document, iframe, navigation or media elements)"

[exclude-ids]
'^url/toascii\.window\.js :: .* \(using <a(rea)?>(\.host(name)?)?\)$' = "browser-only: tests <a>/<area> element URL parsing"
'^encoding/single-byte-decoder\.window\.js :: .* \((XMLHttpRequest|document\.characterSet and document\.inputEncoding)\)$' = "browser-only: XMLHttpRequest / document encoding variants"

[skip]
# TLS / HTTP-2 -- unreachable transport. The wptserve sidecar is plain HTTP on loopback (no WPT-CA
# trust, HTTP/2 off), so .https / .h2 tests can't run on their required transport; the few that pass
# over plain HTTP are not valid signals for it. Skipped wholesale rather than counted.
# The `.https.` / `.h2.` infix marks the required transport in WPT (also in `.https.sub.any.js`,
# `.tentative.https.any.js`, `.https.window.js`, ...), so match it anywhere in the filename.
"**/*.https.*" = "no TLS: HTTP-only server cut, no WPT-CA trust"
"**/*.h2.*" = "no HTTP/2: server started with --no-h2"

# encoding/encodeInto.any.js is NOT skipped: its valid-destination subtests pass. Known failures
# (ratcheted): the SharedArrayBuffer subtests (need WebAssembly.Memory) plus 12 non-SAB -- the
# invalid-destination checks for non-Uint8Array typed arrays over ArrayBuffer, and the detached
# buffer. Skipping the file would drop its passes, so it stays scored.

# Cross-origin fetch subtests (CORS, CORP, cross-origin redirects) aren't file-globbable -- they sit
# among same-origin subtests in otherwise-passing files and need the web-platform.test subdomain
# aliases this loopback cut lacks. They stay ratcheted: structurally plateaued, not regressions.

[fail]
