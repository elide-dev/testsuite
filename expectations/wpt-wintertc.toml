# WinterTC / WPT expectations baseline.
# Keys are picomatch globs over WPT-relative test paths, without the subtest suffix. Skipped tests
# are excluded from the pass-rate denominator (rate over run, not over selection); per-subtest
# failures listed in wpt-wintertc.ratchet.toml are still counted, but expected. Skip only what is
# structurally unreachable in this cut -- and never a file that has passing subtests, or those
# passes would be dropped along with it (see the encodeInto note below).

[skip]
# TLS / HTTP-2 -- unreachable transport. The wptserve sidecar serves plain HTTP on loopback (see
# harness/src/adapters/wpt-server.ts) with no WPT-CA trust and HTTP/2 disabled, so .https / .h2
# tests cannot run on the transport they require. The handful of their subtests that pass over plain
# HTTP are not valid signals for those transports and would need re-validating once real HTTPS / h2
# land -- hence skipped wholesale rather than counted.
# The `.https.` / `.h2.` infix marks the required transport in WPT (also in `.https.sub.any.js`,
# `.tentative.https.any.js`, `.https.window.js`, ...), so match it anywhere in the filename.
"**/*.https.*" = "no TLS: HTTP-only server cut, no WPT-CA trust"
"**/*.h2.*" = "no HTTP/2: server started with --no-h2"

# Browser-only -- no document / window / navigation. `.window.js` is a window-scoped WPT variant, so
# most cannot run headless. Only the window-scoped files with ZERO headless passes are skipped here;
# the ones that DO pass headless (encoding/single-byte-decoder, fetch/content-type/multipart,
# fetch/h1-parsing/lone-cr, fetch/h1-parsing/status-code) are intentionally left in so their passing
# subtests count and their failures ratchet -- same rule as encodeInto below. Re-check this list
# when the suite is re-vendored: a newly-added `.window.js` runs (and its failures surface as
# regressions) until triaged here.
"fetch/fetch-later/**" = "browser-only: fetchLater needs window / iframe / bfcache"
"encoding/streams/invalid-realm.window.js" = "browser-only: window-scoped, no headless pass"
"encoding/streams/realms.window.js" = "browser-only: window-scoped, no headless pass"
"encoding/unsupported-labels.window.js" = "browser-only: window-scoped, no headless pass"
"fetch/api/basic/mediasource.window.js" = "browser-only: window-scoped, no headless pass"
"fetch/api/request/multi-globals/construct-in-detached-frame.window.js" = "browser-only: window-scoped, no headless pass"
"fetch/content-length/parsing.window.js" = "browser-only: window-scoped, no headless pass"
"fetch/content-length/too-long.window.js" = "browser-only: window-scoped, no headless pass"
"fetch/content-type/response.window.js" = "browser-only: window-scoped, no headless pass"
"fetch/content-type/script.window.js" = "browser-only: window-scoped, no headless pass"
"fetch/data-urls/navigate.window.js" = "browser-only: window-scoped, no headless pass"
"fetch/h1-parsing/resources-with-0x00-in-header.window.js" = "browser-only: window-scoped, no headless pass"
"fetch/local-network-access/navigate.tentative.window.js" = "browser-only: window-scoped, no headless pass"
"fetch/nosniff/parsing-nosniff.window.js" = "browser-only: window-scoped, no headless pass"
"fetch/origin/assorted.window.js" = "browser-only: window-scoped, no headless pass"
"fetch/range/general.window.js" = "browser-only: window-scoped, no headless pass"
"url/javascript-urls.window.js" = "browser-only: window-scoped, no headless pass"
"url/percent-encoding.window.js" = "browser-only: window-scoped, no headless pass"
"url/toascii.window.js" = "browser-only: window-scoped, no headless pass"
"url/url-setters-a-area.window.js" = "browser-only: window-scoped, no headless pass"

# encoding/encodeInto.any.js is deliberately NOT skipped: its valid-destination encode subtests
# pass. Its known failures are the SharedArrayBuffer subtests (need WebAssembly.Memory, which Elide
# lacks) plus 12 non-SAB subtests -- the invalid-destination type checks for the non-Uint8Array
# typed arrays backed by a plain ArrayBuffer, and the detached-output-buffer case. Skip is
# file-level, so skipping the file would drop the passing subtests; those failures stay ratcheted.

# Cross-origin fetch subtests (CORS, CORP, cross-origin redirects) are NOT globbable at the file
# level -- they are interleaved with same-origin subtests in files that otherwise pass, and need the
# web-platform.test subdomain aliases this loopback cut does not configure. They therefore stay
# known failures in the ratchet: structurally plateaued in this cut, not regressions.

[fail]
