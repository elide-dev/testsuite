# javac / jtreg expectations baseline.
# Keys are picomatch globs over jtreg test paths such as tools/javac/diags/**.

[skip]
# Custom PlatformProvider via ToolProvider SPI needs runtime service discovery
# ("release version name not supported").
"tools/javac/platform/PlatformProviderTest.java" = "custom --release PlatformProvider SPI requires runtime service discovery, unsupported in native image"
# Elide is a native binary, not a JVM launcher: the jtreg wrapper strips -J*
# flags, so -J-Dline.separator cannot take effect and the single-line usage
# assertion fails. Environmental, not a compiler defect.
"tools/javac/newlines/NewLineTest.java" = "-J JVM flags cannot apply to a native binary; jtreg wrapper strips them by design"

[fail]
