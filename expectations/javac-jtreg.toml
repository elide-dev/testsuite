# Annotation processing is not supported by Elide's embedded javac yet: these
# tests fail uniformly with jtreg "system error (exit code 3)" because the
# annotation-processor action cannot execute. This area was explicitly excluded
# from the default slice until the manifest was broadened in 4fe3c10; muting it
# here keeps the broad selection while isolating a known, tracked gap.
# 150/192 errors in the 1.3.6 run live here. See WHIPLASH #1174.
"tools/javac/processing/**" = "annotation processing unsupported by Elide embedded javac (jtreg exit code 3); tracked in WHIPLASH #1174"

