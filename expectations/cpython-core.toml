# CPython 3.12 pure-core expectations baseline.
# Keys are picomatch globs over CPython module names or unittest case ids.

# Skips CPython itself takes on linux-x64 (implementation details, C accelerators and C-API test
# modules, other platforms) are out of scope: matching skip messages count in no pass rate. Gaps
# in Elide/GraalPy (fork, recvmsg, poll/epoll selectors, ...) stay in the denominator.
# Whole modules whose subject is CPython's implementation (its bytecode, peephole optimizer,
# C API, PEP 509 dict versions, opcode tables) rather than the language or stdlib; the Python docs
# mark bytecode an implementation detail. Out of scope for any other runtime.
# Exclusions count in no rate. Labels:
#   unsupported:    never applies to Elide (CPython bytecode/internals, refcount-driven GC timing).
#   out of scope:   CPython-specific test surfaces Elide could support later (C API, C accelerators).
#   not applicable: skipped for where the suite runs (other platforms, packages the harness omits).
[exclude]
"test_dis" = "unsupported: CPython implementation detail — CPython bytecode (dis); an implementation detail per the docs"
"test_dis.*" = "unsupported: CPython implementation detail — CPython bytecode (dis); an implementation detail per the docs"
"test_peepholer" = "unsupported: CPython implementation detail — CPython bytecode peephole optimizer"
"test_peepholer.*" = "unsupported: CPython implementation detail — CPython bytecode peephole optimizer"
"test_capi" = "out of scope: CPython C API — CPython C-API test suite"
"test_capi.*" = "out of scope: CPython C API — CPython C-API test suite"
"test_dict_version" = "unsupported: CPython implementation detail — PEP 509 dict versions (CPython-only, via _testcapi)"
"test_dict_version.*" = "unsupported: CPython implementation detail — PEP 509 dict versions (CPython-only, via _testcapi)"
"test__opcode" = "unsupported: CPython implementation detail — CPython opcode tables"
"test__opcode.*" = "unsupported: CPython implementation detail — CPython opcode tables"
# The C-accelerator variant of a module's tests where the runtime ships only the Python version
# (the same case as the excluded "requires C version" skips, but these classes fail instead).
"test_bisect.Test*C.*" = "out of scope: CPython C accelerator — tests CPython's _bisect C accelerator; the runtime ships the Python bisect"
"datetimetester.CapiTest_Fast.*" = "out of scope: CPython C API — CPython datetime C API (datetime_CAPI capsule, via _testcapi)"
"test_call.TestPEP590.*" = "out of scope: CPython C API — CPython vectorcall C API (via _testcapi)"
"test_type_cache" = "unsupported: CPython implementation detail — CPython type-attribute cache internals (via _testinternalcapi)"
"test_type_cache.*" = "unsupported: CPython implementation detail — CPython type-attribute cache internals (via _testinternalcapi)"
"test_getpath" = "unsupported: CPython implementation detail — CPython's C startup path calculation (via _testinternalcapi)"
"test_getpath.*" = "unsupported: CPython implementation detail — CPython's C startup path calculation (via _testinternalcapi)"
# Refcounting: CPython frees an object the moment its last reference goes; a tracing GC does not.
"*.test_free_after_iterating" = "unsupported: CPython refcounting/GC — asserts deallocation at refcount zero (CPython refcounting)"
"test_descr.ClassPropertiesAndMethods.test_delete_hook" = "unsupported: CPython refcounting/GC — __del__ finalization timing; not run synchronously after del+gc.collect on GraalPy"
"test_descr.ClassPropertiesAndMethods.test_slots" = "unsupported: CPython refcounting/GC — instance __del__ counting depends on refcount/GC finalization timing"
"test_class.ClassTests.testDel" = "unsupported: CPython refcounting/GC — __del__ not run deterministically under JVM GC"
"test_exceptions.ExceptionTests.test_3114" = "unsupported: CPython refcounting/GC — JVM finalization: object __del__ not run at refcount 0, sys.exception() sentinel never cleared"
"test_exceptions.ExceptionTests.testExceptionCleanupState" = "unsupported: CPython refcounting/GC — weakref/refcount: exception-local object not deterministically freed under JVM GC"
"test_weakref.FinalizeTestCase.test_all_freed" = "unsupported: CPython refcounting/GC — finalize/weakref timing: del+gc.collect does not free object under JVM GC"
"test_weakref.FinalizeTestCase.test_finalize" = "unsupported: CPython refcounting/GC — finalize timing: del does not run finalizer under JVM GC"
"test_weakref.FinalizeTestCase.test_order" = "unsupported: CPython refcounting/GC — finalizer ordering/timing at JVM GC differs from CPython refcount-0 ordering"

"test_builtin.BuiltinTest.test_hash" = "unsupported: CPython implementation detail — hash(str)==hash(bytes) is CPython's siphash"
"test_tuple.TupleTest.test_hash_exact" = "unsupported: CPython implementation detail — exact tuple hash values"
"test_descr.ClassPropertiesAndMethods.test_cycle_through_dict" = "unsupported: CPython refcounting/GC — needs gc.get_objects"
"test_patma.TestSourceLocations.test_jump_threading" = "unsupported: CPython implementation detail — inspects CPython bytecode via dis"
"test_genexps" = "unsupported: CPython implementation detail — tuple-object identity reuse across genexp iterations"
[exclude-skipped]
# CPython internals: C-level details and CPython-only test modules.
"implementation detail specific to cpython" = "unsupported: CPython implementation detail — the test marks itself CPython-only"
"specific to CPython" = "unsupported: CPython implementation detail — the test marks itself CPython-only"
"not relevant in pure python" = "out of scope: CPython C accelerator — CPython C-accelerator detail"
"requires C version" = "out of scope: CPython C accelerator — tests the C accelerator of a module that also ships a Python version"
"requires the C _\\w+ module" = "out of scope: CPython C accelerator — tests a CPython C accelerator module"
"^requires _(heapq|statistics|elementtree|asyncio|uuid|decimal|json|bisect|datetime)$" = "out of scope: CPython C accelerator — tests a CPython C accelerator module"
"^need _stat extension" = "out of scope: CPython C accelerator — tests a CPython C accelerator module"
"_test(internal)?capi\\b|_testlimitedcapi|_testembed|_testmultiphase|_testsinglephase" = "out of scope: CPython C API — CPython C-API test module"
"debug build" = "unsupported: CPython implementation detail — needs a CPython debug build"
"subinterpreters required" = "out of scope: CPython subinterpreters — needs subinterpreters"
# Other platforms: skipped by CPython itself on linux-x64.
"windows|win32|code pages" = "not applicable: other platform — Windows-only"
"\\bos x\\b|macos|darwin" = "not applicable: other platform — macOS-only"
"kqueue|devpoll" = "not applicable: other platform — BSD/Solaris-only selector"
"32-bit" = "not applicable: other platform — 32-bit platforms only"
"case-insensitive filesystem" = "not applicable: other platform — case-insensitive filesystems only"
# Not provided by the harness: stock CPython skips these in the same container.
"^not enough memory: " = "not applicable: not provided by the harness — bigmem test; regrtest runs these only with -M"
"^Hypothesis required" = "not applicable: not provided by the harness — needs the third-party hypothesis package"
"^Test needs Numpy" = "not applicable: not provided by the harness — needs the third-party numpy package"
"^No module named '_tkinter'" = "not applicable: not provided by the harness — needs Tk"
"tzdata not installed" = "not applicable: not provided by the harness — needs the PyPI tzdata package"

